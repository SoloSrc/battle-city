<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="960" height="680" fill="#f6f4ee"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#222">05 · Card face layout, anime style</text>
  <text x="20" y="50" fill="#555">Art-first face with no name box and no effect text. Name and text are shown in the UI, not on the card.</text>

  <!-- monster card, 59 x 86 mm at 4px/mm -->
  <g transform="translate(60,80)">
    <text x="0" y="0" font-weight="bold" fill="#222">Monster</text>
    <rect x="0" y="12" width="236" height="344" rx="8" fill="#c9a24a" stroke="#333" stroke-width="2"/>
    <!-- art window -->
    <rect x="14" y="26" width="208" height="248" fill="#2e4a7a" stroke="#333"/>
    <text x="70" y="150" fill="#dfe9ff">ART (full bleed)</text>
    <!-- stat band -->
    <rect x="14" y="284" width="208" height="62" fill="#e8d28a" stroke="#333"/>
    <!-- stars -->
    <g fill="#f0a020" stroke="#7a4a00">
      <circle cx="30" cy="298" r="5"/><circle cx="44" cy="298" r="5"/><circle cx="58" cy="298" r="5"/><circle cx="72" cy="298" r="5"/><circle cx="86" cy="298" r="5"/><circle cx="100" cy="298" r="5"/><circle cx="114" cy="298" r="5"/>
    </g>
    <!-- attribute -->
    <circle cx="204" cy="298" r="10" fill="#3a2a5a" stroke="#333"/>
    <text x="199" y="302" font-size="10" fill="#fff">A</text>
    <!-- atk / def boxes -->
    <rect x="24" y="312" width="86" height="26" rx="3" fill="#fff" stroke="#7a4a00"/>
    <text x="40" y="330" font-size="16" fill="#333">2500</text>
    <rect x="126" y="312" width="86" height="26" rx="3" fill="#fff" stroke="#7a4a00"/>
    <text x="142" y="330" font-size="16" fill="#333">2100</text>
    <!-- dims -->
    <line x1="0" y1="372" x2="236" y2="372" stroke="#333"/><text x="80" y="388" fill="#555">59 mm · 4:5.8</text>
    <line x1="252" y1="12" x2="252" y2="356" stroke="#333"/><text x="258" y="190" fill="#555">86 mm</text>
  </g>

  <!-- callouts -->
  <g transform="translate(400,90)" fill="#333">
    <text x="0" y="10">art window ≈ 72 % of the face, 6 mm border</text>
    <text x="0" y="30">frame colour by type: normal = tan, effect = orange,</text>
    <text x="0" y="48">fusion = violet, ritual = blue, spell = teal, trap = magenta</text>
    <text x="0" y="78">level: row of stars, left-aligned, 1–12</text>
    <text x="0" y="98">attribute: circular icon, right-aligned, 7 originals to design</text>
    <text x="0" y="128">ATK · DEF: two boxed numbers, no labels</text>
    <text x="0" y="148">font: geometric sans, wide, high contrast at 40 px tall</text>
    <text x="0" y="178">no name, no type line, no effect text, no set code, no copyright line</text>
    <text x="0" y="198">back: single symmetrical pattern, one accent colour</text>
  </g>

  <!-- spell / trap -->
  <g transform="translate(400,320)">
    <text x="0" y="0" font-weight="bold" fill="#222">Spell / Trap</text>
    <rect x="0" y="12" width="118" height="172" rx="5" fill="#2a8f8a" stroke="#333" stroke-width="2"/>
    <rect x="8" y="20" width="102" height="124" fill="#1d4d55" stroke="#333"/>
    <text x="34" y="86" fill="#cfe" font-size="11">ART</text>
    <rect x="8" y="150" width="102" height="28" fill="#7fd1cc" stroke="#333"/>
    <circle cx="20" cy="164" r="8" fill="#fff" stroke="#333"/>
    <text x="16" y="168" font-size="10" fill="#333">S</text>
    <rect x="34" y="158" width="66" height="12" fill="#fff" stroke="#333"/>
    <text x="40" y="167" font-size="8" fill="#333">icon only</text>
    <rect x="140" y="12" width="118" height="172" rx="5" fill="#b03a8a" stroke="#333" stroke-width="2"/>
    <rect x="148" y="20" width="102" height="124" fill="#5a1f4a" stroke="#333"/>
    <text x="174" y="86" fill="#fcd" font-size="11">ART</text>
    <rect x="148" y="150" width="102" height="28" fill="#e6a0cf" stroke="#333"/>
    <circle cx="160" cy="164" r="8" fill="#fff" stroke="#333"/>
    <text x="156" y="168" font-size="10" fill="#333">T</text>
    <text x="0" y="205" fill="#333">bottom band: spell/trap icon + subtype glyph</text><text x="0" y="222" fill="#333">(equip, continuous, quick-play, counter, field)</text>
  </g>

  <g transform="translate(60,590)" fill="#333">
    <text x="0" y="0" font-weight="bold" fill="#222">Production</text>
    <text x="0" y="20">· Deliver frames as layered source plus PNG at 590 × 860 px. Art as separate 512 × 512 px textures placed by code.</text>
    <text x="0" y="40">· PoC uses placeholder art (flat colour or silhouette) inside the final frame; the frame and glyph set are final.</text>
    <text x="0" y="60">· Reference feel: 4Kids-era anime card faces. Do not copy official card art or the TCG frame.</text>
  </g>
</svg>
