<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="520" fill="#f6f4ee"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#222">01 · Overworld camera and scale</text>
  <text x="20" y="50" fill="#555">Tilted top-down, fixed yaw, follows the player. Values are starting points for tuning.</text>

  <!-- side view -->
  <g transform="translate(40,90)">
    <text x="0" y="0" font-weight="bold" fill="#222">Side view</text>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#444" stroke-width="2"/>
    <text x="0" y="318" fill="#555">ground</text>
    <!-- character 1.7 m ~ 60px -->
    <g transform="translate(200,300)">
      <circle cx="0" cy="-52" r="8" fill="#e8b48a" stroke="#333"/>
      <rect x="-7" y="-44" width="14" height="24" rx="3" fill="#4a6fb5" stroke="#333"/>
      <rect x="-7" y="-20" width="6" height="20" fill="#3a3f5c" stroke="#333"/>
      <rect x="1" y="-20" width="6" height="20" fill="#3a3f5c" stroke="#333"/>
    </g>
    <text x="150" y="330" fill="#333">player · 1.7 m</text>
    <!-- building -->
    <rect x="290" y="150" width="90" height="150" fill="#d9c7a3" stroke="#333"/>
    <polygon points="285,150 335,115 385,150" fill="#c0603a" stroke="#333"/>
    <text x="295" y="140" fill="#333">2-storey shop · 7 m</text>
    <!-- camera -->
    <g transform="translate(60,60)">
      <rect x="-14" y="-9" width="28" height="18" rx="3" fill="#333"/>
      <polygon points="14,-6 26,-12 26,12 14,6" fill="#333"/>
    </g>
    <line x1="80" y1="60" x2="200" y2="248" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M80,60 L200,60" stroke="#999" stroke-dasharray="3 3"/>
    <path d="M115,60 A35,35 0 0 1 108,86" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="122" y="84" fill="#c0392b">pitch ≈ 55–60°</text>
    <text x="0" y="45" fill="#333">camera</text>
    <text x="0" y="200" fill="#555">distance ≈ 12–14 m</text>
    <text x="0" y="216" fill="#555">FOV ≈ 35° (mild perspective)</text>
    <text x="0" y="232" fill="#555">no roll, no player-controlled yaw</text>
  </g>

  <!-- top view -->
  <g transform="translate(500,90)">
    <text x="0" y="0" font-weight="bold" fill="#222">Framing on a 16:9 screen</text>
    <rect x="0" y="15" width="360" height="202" fill="#dfe6d3" stroke="#333"/>
    <rect x="40" y="15" width="120" height="70" fill="#d9c7a3" stroke="#333"/>
    <rect x="220" y="15" width="140" height="60" fill="#b9c7ad" stroke="#333"/>
    <rect x="0" y="120" width="360" height="40" fill="#b8b8b8"/>
    <rect x="0" y="118" width="360" height="4" fill="#ffffff"/>
    <rect x="0" y="158" width="360" height="4" fill="#ffffff"/>
    <g transform="translate(180,140)">
      <ellipse cx="0" cy="12" rx="10" ry="4" fill="#0003"/>
      <circle cx="0" cy="-14" r="6" fill="#e8b48a" stroke="#333"/>
      <rect x="-5" y="-8" width="10" height="16" rx="2" fill="#4a6fb5" stroke="#333"/>
    </g>
    <line x1="180" y1="15" x2="180" y2="217" stroke="#c0392b" stroke-dasharray="4 3"/>
    <line x1="0" y1="140" x2="360" y2="140" stroke="#c0392b" stroke-dasharray="4 3"/>
    <text x="8" y="235" fill="#555">player centred, slightly below the midline</text>
    <text x="8" y="251" fill="#555">≈ 9 character-heights of world visible vertically</text>
    <text x="8" y="267" fill="#555">buildings never fully occlude the player</text>
  </g>

  <!-- notes -->
  <g transform="translate(40,440)">
    <text x="0" y="0" font-weight="bold" fill="#222">Style notes</text>
    <text x="0" y="20" fill="#333">· Blocky, readable buildings with saturated roofs; clean edges, soft ambient shadow, one key light.</text>
    <text x="0" y="38" fill="#333">· Characters use realistic proportions (sheet 02), so tune camera distance so a 1.7 m figure reads at ≈ 60 px at 1080p.</text>
    <text x="0" y="56" fill="#333">· Reference feel: Pokémon Brilliant Diamond / Shining Pearl city streets. Do not copy their assets.</text>
  </g>
</svg>
