<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1260" height="520" fill="#f6f4ee"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#222">04 · Duel disk, original design</text>
  <text x="20" y="50" fill="#555">Worn on the left forearm. Functional layout follows the anime's device; the shape and styling are ours.</text>

  <g transform="translate(80,110)">
    <!-- forearm -->
    <rect x="0" y="60" width="200" height="60" rx="30" fill="#e8b48a" stroke="#333"/>
    <text x="20" y="150" fill="#555">forearm</text>
    <!-- hub -->
    <circle cx="150" cy="90" r="52" fill="#dcdcdc" stroke="#333" stroke-width="2"/>
    <circle cx="150" cy="90" r="34" fill="#3b3f4a" stroke="#333"/>
    <!-- life counter -->
    <rect x="128" y="36" width="44" height="16" rx="3" fill="#0a2a1a" stroke="#333"/>
    <text x="133" y="48" font-size="10" fill="#6cff9a" font-family="monospace">8000</text>
    <!-- deck slot -->
    <rect x="96" y="70" width="18" height="26" rx="2" fill="#7a2b2b" stroke="#333"/>
    <!-- graveyard slot -->
    <rect x="186" y="70" width="18" height="26" rx="2" fill="#555" stroke="#333"/>
    <!-- blade -->
    <g transform="translate(190,60) rotate(-12)">
      <polygon points="0,0 300,-10 330,10 330,50 300,60 0,50" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
      <g fill="#bfe3ff" stroke="#2a7fb5">
        <rect x="20" y="10" width="40" height="30" rx="2"/>
        <rect x="76" y="8" width="40" height="30" rx="2"/>
        <rect x="132" y="6" width="40" height="30" rx="2"/>
        <rect x="188" y="4" width="40" height="30" rx="2"/>
        <rect x="244" y="2" width="40" height="30" rx="2"/>
      </g>
      <text x="40" y="80" fill="#2a7fb5" font-size="11">5 monster zones on top · 5 spell/trap zones underneath</text>
    </g>
    <!-- callouts -->
    <g fill="#333">
      <line x1="150" y1="36" x2="150" y2="0" stroke="#333"/><text x="-10" y="-8">life counter (LED, readable in the duel camera)</text>
      <line x1="105" y1="70" x2="60" y2="20" stroke="#333"/><text x="-60" y="14">deck holder (40–60 cards)</text>
      <line x1="195" y1="96" x2="235" y2="160" stroke="#333"/><text x="200" y="176">graveyard slot</text>
      <line x1="150" y1="142" x2="150" y2="180" stroke="#333"/><text x="80" y="196">hub: folds the blade in when idle</text>
    </g>
  </g>

  <g transform="translate(720,110)" fill="#333">
    <text x="0" y="0" font-weight="bold" fill="#222">Design constraints</text>
    <text x="0" y="24">· Reads as a silhouette in the overworld at ≈ 60 px character height.</text>
    <text x="0" y="44">· Two states: folded (walking) and deployed (duelling); a short unfold animation.</text>
    <text x="0" y="64">· Colour: light grey body, one accent colour per duelist (matches outfit).</text>
    <text x="0" y="84">· Budget: ≤ 1.5 k tris, one 512 px texture, shares the character toon shader.</text>
    <text x="0" y="104">· Blade zones are the anchors for the floating holographic cards (sheet 03).</text>
    <text x="0" y="124">· Deck and graveyard slots need card-insert animations for draw and send.</text>
    <text x="0" y="152" font-weight="bold" fill="#222">Do not</text>
    <text x="0" y="172">· Reproduce the anime disk's exact shape, the KaibaCorp mark, or its colourways.</text>
  </g>

  <g transform="translate(80,400)" fill="#333">
    <text x="0" y="0" font-weight="bold" fill="#222">States</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="60" height="26" rx="13" fill="#e8b48a" stroke="#333"/>
      <circle cx="44" cy="13" r="14" fill="#dcdcdc" stroke="#333"/>
      <rect x="52" y="4" width="26" height="18" rx="3" fill="#e6e6e6" stroke="#333"/>
      <text x="90" y="18">folded: blade tucked along the forearm</text>
    </g>
    <g transform="translate(0,60)">
      <rect x="0" y="0" width="60" height="26" rx="13" fill="#e8b48a" stroke="#333"/>
      <circle cx="44" cy="13" r="14" fill="#dcdcdc" stroke="#333"/>
      <polygon points="56,4 130,-4 136,10 56,22" fill="#e6e6e6" stroke="#333"/>
      <text x="150" y="18">deployed: blade swings out and locks, zones light up</text>
    </g>
  </g>
</svg>
