<text x="655" y="132" font-size="20" font-weight="bold">Readable route, clear duel pockets</text>
<text x="655" y="166" font-size="14">Arrival → shop → A → B → C</text>
<text x="655" y="191" font-size="14">East loop returns to the shop.</text>
<text x="655" y="216" font-size="14">Progression rules belong to the GDD.</text>
<text x="655" y="241" font-size="14"></text>
<text x="655" y="266" font-size="14">Blue / coral dots: duelists 7 m apart.</text>
<text x="655" y="291" font-size="14">Gold areas: invisible staging reservations.</text>
<text x="655" y="316" font-size="14">Grey: main street and return loop.</text>
<text x="655" y="341" font-size="14">Blue building: the only enterable interior.</text>
<text x="655" y="366" font-size="14"></text>
<text x="655" y="391" font-size="14">Keep props outside routes and camera sweeps.</text>
<text x="655" y="416" font-size="14">Test all ten world card zones per side.</text>
<text x="655" y="441" font-size="14">No separate arena; the street stays visible.</text>
<text x="655" y="466" font-size="14"></text>
<text x="655" y="491" font-size="14">N ↑  /  −Z       E →  /  +X</text>
<text x="655" y="516" font-size="14">Ground Y = 0; 1 unit = 1 metre proposed.</text>
<rect x="655" y="566" width="392" height="120" rx="6" fill="#e5e1d6"/>
<text x="675" y="594" font-size="16" font-weight="bold">BLOCKOUT ACCEPTANCE</text>
<text x="675" y="620" font-size="13">Walk the full route and shop entry/return.</text>
<text x="675" y="642" font-size="13">See the avatar at every required corner.</text>
<text x="675" y="664" font-size="13">Frame both duelists and cards at A, B and C.</text>
