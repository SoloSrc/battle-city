<text x="650" y="135" font-size="20">PROGRESSION</text>
<text x="650" y="166" font-size="14">Room → Plaza: Nico tutorial</text>
<text x="650" y="191" font-size="14">G1 opens after defeating Nico.</text>
<text x="650" y="216" font-size="14">Park: Mara</text>
<text x="650" y="241" font-size="14">G2 opens after defeating Mara.</text>
<text x="650" y="266" font-size="14">Old Arcade: Arcade Owner</text>
<text x="650" y="291" font-size="14">Ending → district free play.</text>
<text x="650" y="345" font-size="20">AUTHORING CONTRACT</text>
<text x="650" y="376" font-size="13">Gold pockets: 16 × 12 m, duelists 7 m apart.</text>
<text x="650" y="401" font-size="13">NPC triggers: 8 m / 60° sight cone.</text>
<text x="650" y="426" font-size="13">Approach path must remain unobstructed.</text>
<text x="650" y="451" font-size="13">Defeated NPCs: manual rematches only.</text>
<text x="650" y="476" font-size="13">Market: card shop plus two NPCs.</text>
<text x="650" y="501" font-size="13">Deck editor: pause menu.</text>
<text x="650" y="526" font-size="13">Dark dividers: boundaries; gates are sole access.</text>
<text x="650" y="551" font-size="13">Edge streets closed; add construction NPC.</text>
<text x="650" y="608" font-size="20">CAMERA / VALIDATION</text>
<text x="650" y="640" font-size="13">Per-area bounds; tighter interior camera.</text>
<text x="650" y="663" font-size="13">Test cones, gates, returns and full duel HUD.</text>
<text x="650" y="686" font-size="13">Appearance concepts do not define geography.</text>
<text x="650" y="709" font-size="13">No Godot playtest performed yet.</text>
