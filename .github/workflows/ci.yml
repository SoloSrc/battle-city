name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GODOT_VERSION: 4.7.2

jobs:
  dotnet:
    name: dotnet format, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BattleCity.sln
      - name: Format check
        run: dotnet format BattleCity.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build BattleCity.sln --no-restore --configuration Debug
      - name: Duel.Core tests
        run: dotnet test tests/Duel.Core.Tests --no-build --configuration Debug --logger "trx;LogFileName=duel-core.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel-core-test-results
          path: tests/Duel.Core.Tests/TestResults/*.trx
          if-no-files-found: ignore

  godot-import:
    name: headless Godot import
    runs-on: ubuntu-latest
    needs: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot .NET
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/* ~/godot/
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
      - name: Build C# assembly
        run: dotnet build BattleCity.sln --configuration Debug
      - name: Import project
        run: |
          set -o pipefail
          ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 --headless --path . --import 2>&1 | tee import.log
          if grep -E "^(ERROR|SCRIPT ERROR)" import.log; then
            echo "Godot reported errors during import"; exit 1
          fi
      - name: Run boot scene once
        run: |
          set -o pipefail
          ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee run.log
          if grep -E "^(ERROR|SCRIPT ERROR)" run.log; then
            echo "Godot reported errors while running the boot scene"; exit 1
          fi
          grep -q "Battle City skeleton" run.log
      - name: Run pipeline smoke-test scene once
        run: |
          set -o pipefail
          ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 --headless --path . res://tests/scenes/SmokeTest.tscn --fixed-fps 60 --quit-after 60 2>&1 | tee smoke.log
          if grep -E "^(ERROR|SCRIPT ERROR|SmokeTest FAIL)" smoke.log; then
            echo "SmokeTest reported errors"; exit 1
          fi
          grep -q "SmokeTest summary" smoke.log
      - name: Run character test scene once
        run: |
          set -o pipefail
          ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 --headless --path . res://tests/scenes/CharacterTest.tscn --fixed-fps 60 --quit-after 300 2>&1 | tee character.log
          if grep -E "^(ERROR|SCRIPT ERROR|CharacterTest FAIL)" character.log; then
            echo "CharacterTest reported errors"; exit 1
          fi
          grep -q "CharacterTest summary" character.log
      - name: Run player test scene once
        run: |
          set -o pipefail
          ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64 --headless --path . res://tests/scenes/PlayerTest.tscn --fixed-fps 60 --quit-after 400 2>&1 | tee player.log
          if grep -E "^(ERROR|SCRIPT ERROR|PlayerTest FAIL)" player.log; then
            echo "PlayerTest reported errors"; exit 1
          fi
          grep -q "PlayerTest summary" player.log
